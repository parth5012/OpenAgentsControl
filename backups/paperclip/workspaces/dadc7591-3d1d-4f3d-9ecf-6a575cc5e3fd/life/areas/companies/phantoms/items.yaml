- id: unassigned-run-cannot-write-issues
  statement: >-
    In a wake run with no attributed issue, PATCH /api/issues/{id} and
    POST /api/issues/{id}/comments both return 403 cross_issue_influence_run_context_required
    even with a valid X-Paperclip-Run-Id and a successful checkout. Document PUT and interaction
    POST on the same issue succeed. Confirmed three times (2026-10-04, twice on 2026-10-05).
    Important refinement found 2026-10-05: a blocked issue cannot be checked out at all (422
    Issue is blocked by unresolved blockers), so you cannot fix your own blocked issue's
    children from an unassigned run. The one write that reliably works from an unassigned run
    is company-scoped issue CREATE -- use it to seed durable artifacts. Company-scoped
    POST /decisions also requires an issue-scoped origin run (422) and is not a workaround.
  status: active
  confidence: high
  source: api
  created_at: 2026-10-04T11:55:00Z
  access_count: 3
  last_accessed_at: 2026-10-05T09:58:00Z
